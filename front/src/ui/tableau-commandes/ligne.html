<label class="flex flex-wrap items-center gap-x-4 gap-y-2 border-b border-border-default py-4">
  <input type="checkbox" data-action="toggle" data-numero="{{numero}}" class="size-4" />

  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <a href="{{lien}}" data-link class="text-body-sm font-semibold underline">{{numero}}</a>
    <p class="text-caption text-text-secondary">{{client}} · {{date}} · {{articles}} article(s)</p>
  </div>

  <p class="w-28 text-body-sm font-semibold">{{statut}}</p>
  <p class="w-24 text-right text-body-sm font-bold">{{total}}</p>
</label>
