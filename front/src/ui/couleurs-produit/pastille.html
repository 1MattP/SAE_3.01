<button type="button" data-code="{{code}}" title="{{code}}" class="flex size-9 items-center justify-center rounded-full border border-border-default hover:border-border-strong aria-pressed:border-border-active aria-pressed:border-2">
  <span class="pointer-events-none size-6 rounded-full border border-border-default bg-(--couleur)" style="--couleur: {{code}}"></span>
  <span class="sr-only">{{code}}</span>
</button>
