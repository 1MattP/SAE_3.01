<div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-border-default py-4">
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="text-body-sm font-semibold">{{code}} · -{{pourcentage}} %</p>
    <p class="text-caption text-text-secondary">{{utilisations}} utilisation(s) · {{remises}} de réductions accordées</p>
  </div>

  <div class="flex w-full items-center gap-2 sm:w-auto">
    <a href="{{lien}}" data-link class="flex h-9 items-center rounded-md border border-border-default px-4 text-caption font-semibold hover:bg-surface-hover">Modifier</a>
    <button type="button" data-action="remove" data-id="{{id}}" class="h-9 rounded-md border border-border-default px-4 text-caption font-semibold hover:bg-surface-hover">Supprimer</button>
  </div>
</div>
