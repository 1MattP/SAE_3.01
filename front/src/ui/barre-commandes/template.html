<div class="mt-6 flex flex-wrap items-end justify-between gap-4 font-body text-text-primary">
  <label class="flex flex-col gap-2 text-caption font-semibold">
    Trier par
    <select name="tri" class="h-10 rounded-md border border-border-default bg-background-default px-3 text-body-sm font-normal hover:border-border-strong focus:border-border-active">
      <option value="date_desc">Date (récentes d'abord)</option>
      <option value="date_asc">Date (anciennes d'abord)</option>
      <option value="statut">Statut</option>
      <option value="montant_desc">Montant (décroissant)</option>
      <option value="montant_asc">Montant (croissant)</option>
    </select>
  </label>

  <div class="flex flex-wrap items-center gap-2">
    <p class="mr-2 text-caption text-text-secondary">{{nombre}} sélectionnée(s)</p>
    <button type="button" data-action="disponible" class="h-10 rounded-md border border-border-default px-4 text-caption font-semibold hover:bg-surface-hover disabled:cursor-not-allowed disabled:text-text-disabled">Marquer disponible</button>
    <button type="button" data-action="retiree" class="h-10 rounded-md border border-border-default px-4 text-caption font-semibold hover:bg-surface-hover disabled:cursor-not-allowed disabled:text-text-disabled">Marquer retirée</button>
    <button type="button" data-action="annuler" class="h-10 rounded-md bg-action-primary-background px-4 text-caption font-semibold text-action-primary-foreground hover:bg-action-primary-hover disabled:cursor-not-allowed disabled:bg-surface-disabled disabled:text-text-disabled">Annuler</button>
  </div>
</div>
