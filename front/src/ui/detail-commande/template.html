<div class="font-body text-text-primary">
  <div class="flex flex-wrap items-start justify-between gap-4 border-b border-border-default pb-4">
    <div class="flex flex-col gap-1">
      <h2 class="text-body-lg font-bold">{{numero}}</h2>
      <p class="text-caption text-text-secondary">Passée le {{date}}</p>
    </div>
    <div class="flex items-center gap-4">
      <p class="text-body-sm font-semibold">{{statut}}</p>
      <button type="button" data-action="reorder" data-numero="{{numero}}" class="h-9 rounded-md border border-border-default px-4 text-caption font-semibold hover:bg-surface-hover">Commander à nouveau</button>
    </div>
  </div>

  <div>
    <slot name="lines"></slot>
  </div>

  <div data-reduction class="mt-4 flex justify-between text-body-sm text-text-secondary">
    <p>{{libelleReduction}}</p>
    <p>-{{reduction}}</p>
  </div>

  <div class="mt-4 flex justify-between text-body-sm font-bold">
    <p>Total</p>
    <p>{{total}}</p>
  </div>
</div>
