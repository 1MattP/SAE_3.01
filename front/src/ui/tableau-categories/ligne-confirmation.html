<div class="flex flex-wrap items-center gap-x-4 gap-y-3 border-b border-border-default bg-surface-disabled px-3 py-4">
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="text-body-sm font-semibold">Supprimer « {{libelle}} » ?</p>
    <p class="text-caption text-text-secondary">Cette action est définitive. Une catégorie qui contient encore des produits ne peut pas être supprimée.</p>
  </div>

  <div class="flex w-full items-center gap-2 sm:w-auto">
    <button type="button" data-action="confirmRemove" data-id="{{id}}" class="h-9 rounded-md bg-action-primary-background px-4 text-caption font-semibold text-action-primary-foreground hover:bg-action-primary-hover">Oui, supprimer</button>
    <button type="button" data-action="cancelRemove" class="h-9 rounded-md border border-border-default bg-surface-default px-4 text-caption font-semibold hover:bg-surface-hover">Annuler</button>
  </div>
</div>
