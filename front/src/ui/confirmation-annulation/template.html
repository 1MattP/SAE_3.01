<div class="mt-6 flex flex-wrap items-center gap-x-4 gap-y-3 border border-border-default bg-surface-disabled px-4 py-4 font-body text-text-primary">
  <div class="flex min-w-0 flex-1 flex-col gap-1">
    <p class="text-body-sm font-semibold">{{titre}}</p>
    <p class="text-caption text-text-secondary">Les produits seront remis en stock. Cette action ne peut pas être défaite.</p>
  </div>

  <div class="flex w-full items-center gap-2 sm:w-auto">
    <button type="button" data-action="confirm" class="h-9 rounded-md bg-action-primary-background px-4 text-caption font-semibold text-action-primary-foreground hover:bg-action-primary-hover">Oui, annuler</button>
    <button type="button" data-action="cancel" class="h-9 rounded-md border border-border-default bg-surface-default px-4 text-caption font-semibold hover:bg-surface-hover">Non</button>
  </div>
</div>
